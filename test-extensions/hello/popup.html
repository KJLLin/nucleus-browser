<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Hello Nucleus</title>
<style>
  body {
    margin: 0;
    width: 280px;
    padding: 14px 16px;
    font: 13px/1.6 -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
    color: #1a1d24;
    background: #fff;
  }
  h1 { margin: 0 0 4px; font-size: 14px; }
  .sub { color: #7a8494; font-size: 11px; font-family: Consolas, monospace; }
  .row { margin-top: 10px; padding-top: 10px; border-top: 1px solid #eef1f6; }
  .k { color: #7a8494; font-size: 11px; }
  .v { font-size: 12px; word-break: break-all; }
  button {
    margin-top: 10px; width: 100%; height: 28px; border: none; border-radius: 6px;
    background: #3563e9; color: #fff; font-size: 12px; cursor: pointer;
  }
  pre { margin: 6px 0 0; padding: 8px; background: #f5f7fb; border-radius: 6px; font-size: 10.5px; white-space: pre-wrap; }
</style>
</head>
<body>
  <h1>Hello Nucleus</h1>
  <div class="sub" id="id"></div>

  <div class="row">
    <div class="k">最后访问</div>
    <div class="v" id="last">读取中…</div>
  </div>

  <button id="ping">向后台页发消息</button>
  <pre id="out" hidden></pre>

  <script src="popup.js"></script>
</body>
</html>
