<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self' nucleus:; script-src 'self' nucleus:; style-src 'self' nucleus: 'unsafe-inline'; img-src 'self' nucleus: data:;">
<title>运行时自省 · Nucleus</title>
<link rel="stylesheet" href="inspector.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
        <circle cx="12" cy="12" r="3" fill="currentColor"/>
        <ellipse cx="12" cy="12" rx="9" ry="4.4" fill="none" stroke="currentColor" stroke-width="1.3" transform="rotate(-28 12 12)"/>
        <ellipse cx="12" cy="12" rx="9" ry="4.4" fill="none" stroke="currentColor" stroke-width="1.3" transform="rotate(28 12 12)"/>
      </svg>
      <span>运行时自省</span>
    </div>
    <div class="meta">
      <span id="profile" class="chip"></span>
      <span id="stamp" class="stamp">连接中…</span>
      <button id="refresh" class="btn">刷新</button>
    </div>
  </header>

  <div id="layout">
    <nav id="nav">
      <button class="nav-item active" data-view="overview">概览</button>
      <button class="nav-item" data-view="plugins">插件与 fiber</button>
      <button class="nav-item" data-view="slots">槽位树</button>
      <button class="nav-item" data-view="rpc">RPC 契约</button>
      <button class="nav-item" data-view="events">事件流</button>
      <button class="nav-item" data-view="health">内核健康</button>
    </nav>
    <main id="content"><div class="loading">正在读取运行时状态…</div></main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
