<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self' nucleus:; script-src 'self' nucleus:; style-src 'self' 'unsafe-inline' nucleus:; img-src 'self' data: https: http:;">
<title>新标签页</title>
<link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="bg-grid"></div>
  <main class="wrap">
    <section class="hero">
      <div class="clock">
        <div class="time" id="time">--:--</div>
        <div class="date" id="date"></div>
      </div>
      <div class="greeting" id="greeting">你好</div>
    </section>

    <form class="search" id="searchForm" autocomplete="off">
      <span class="s-icon">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
      </span>
      <input id="q" type="text" placeholder="搜索，或输入网址" spellcheck="false">
      <button type="button" class="engine" id="engine" title="切换搜索引擎">Bing</button>
    </form>

    <section class="shortcuts" id="shortcuts"></section>

    <button class="add" id="addShortcut" title="添加快捷方式">+ 添加快捷方式</button>
  </main>

  <footer class="foot">
    <span id="brand">Nucleus</span>
    <span class="dot">·</span>
    <span id="chromeVer">Chromium</span>
    <span class="dot">·</span>
    <span class="motto">一切皆插件</span>
  </footer>

  <script type="module" src="page.js"></script>
</body>
</html>
